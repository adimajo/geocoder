[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geocoder"
dynamic = ["version"]
description = "geocoder is a (reverse) address to geolocation mapping tool for France"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Paulo Emilio de Vilhena" },
    { name = "Adrien Ehrhardt" },
]
keywords = ["geocoder", "France", "BAN", "geocoding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Utilities",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "loguru",
    "numpy>=1.24",
    "requests>=2.31",
    "sortedcontainers",
    "tqdm",
    "unidecode",
]

[project.optional-dependencies]
api = [
    "flask>=3.0",
    "flask-restx>=1.3",
    "gunicorn>=22.0; sys_platform == 'linux'",
    "pandas>=2.0",
    "werkzeug>=3.0",
]
s3 = ["boto3"]

[project.urls]
Homepage = "https://github.com/adimajo/geocoder"
Documentation = "https://adimajo.github.io/geocoder/"

[project.scripts]
geocoder = "geocoder.geocoding.__main__:main"

[dependency-groups]
dev = [
    "bandit",
    "coverage[toml]",
    "pip-audit",
    "pytest",
    "ruff",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.hatch.version]
path = "geocoder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["geocoder"]

[tool.hatch.build.targets.sdist]
include = ["geocoder", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90"]
ignore = ["B905"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the BAN database (downloaded for département 01 when DEBUG=true)"]

[tool.coverage.run]
source = ["geocoder"]
omit = ["*/.local/*", "geocoder/geocoding/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests"]
